name: Release

# On every push to main: if the version in manifest.json has no tag yet,
# create the tag v<version> and a GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version custom_components/druck_assistant/manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract release notes from CHANGELOG.md
        if: steps.version.outputs.exists == 'false'
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No [$version] section in CHANGELOG, generating notes automatically."
            rm -f notes.md
          fi

      - name: Create zip for HACS
        if: steps.version.outputs.exists == 'false'
        run: |
          cd custom_components/druck_assistant
          zip -r ../../druck_assistant.zip . -x "__pycache__/*" "*.pyc"

      - name: Create tag and release
        if: steps.version.outputs.exists == 'false'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if [ -f notes.md ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          # Versions with a suffix (e.g. 0.2.0-beta.1) are published as pre-releases.
          if [[ "$tag" == *-* ]]; then
            flags=(--prerelease)
          else
            flags=(--latest)
          fi
          gh release create "$tag" druck_assistant.zip \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            "${flags[@]}" \
            "${notes[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
