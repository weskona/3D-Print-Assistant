name: Release

# Bei jedem Push auf main: Wenn die Version in manifest.json noch keinen Tag hat,
# wird der Tag v<version> angelegt und ein GitHub Release erstellt.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: version
        run: |
          version=$(jq -r .version custom_components/druck_assistant/manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version existiert bereits, nichts zu tun."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release Notes aus CHANGELOG.md extrahieren
        if: steps.version.outputs.exists == 'false'
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Kein Abschnitt [$version] im CHANGELOG, Notes werden automatisch erzeugt."
            rm -f notes.md
          fi

      - name: Zip für HACS erstellen
        if: steps.version.outputs.exists == 'false'
        run: |
          cd custom_components/druck_assistant
          zip -r ../../druck_assistant.zip . -x "__pycache__/*" "*.pyc"

      - name: Tag und Release erstellen
        if: steps.version.outputs.exists == 'false'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if [ -f notes.md ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$tag" druck_assistant.zip \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            "${notes[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
